# ============================================================
# 本地 Docker 运行配置（仅本机可访问）
# ------------------------------------------------------------
# 用法：
#   docker compose -f docker-compose.local.yml up -d --build
# 访问：
#   http://127.0.0.1:8080
# 停止：
#   docker compose -f docker-compose.local.yml down
#
# 说明：
#   - QSIM_MODE=local：本地模式（不开启跨域、按本地语义运行）
#   - QSIM_BIND_HOST=0.0.0.0：容器内监听所有网卡，否则宿主机端口映射无法访问
#   - 端口映射写 127.0.0.1:8080，确保只在本机回环地址暴露（外部不可访问）
# ============================================================
services:
  quantum-simulator-local:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: graphical-quantum-simulator:local
    container_name: gqs-local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QSIM_MODE: local
      QSIM_BIND_HOST: "0.0.0.0"
      QSIM_PORT: "8080"
    restart: unless-stopped
